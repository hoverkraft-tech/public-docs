name: Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: "The build artifact id."
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}
    secrets:
      ALGOLIA_API_KEY:
        required: true

permissions: {}

jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false

  continuous-integration-prepare-docs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    strategy:
      matrix:
        working-directory:
          - .github/actions/prepare-docs
          - .github/actions/generate-docs
          - .github/actions/inject-docs
          - .github/actions/resolve-docs-target
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      test: '{"comment": false, "report-group": "continuous-integration-prepare-docs"}'
      working-directory: ${{ matrix.working-directory }}
      build: ""
      lint: ""
      dependency-review: false

  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    secrets:
      build-secrets: |
        ALGOLIA_API_KEY=${{ secrets.ALGOLIA_API_KEY }}
    with:
      test: '{"comment": false, "report-group": "continuous-integration"}'
      working-directory: application
      build: |
        {
          "artifact": ["build"],
          "env": { "ALGOLIA_APP_ID": "${{ vars.ALGOLIA_APP_ID }}" }
        }

  reports:
    needs: [lint, continuous-integration-prepare-docs, continuous-integration]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
